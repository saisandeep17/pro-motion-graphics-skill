<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kinetic Typography — Category E Example</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #090A0F;
      color: #F4F5F8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .viewport {
      width: 1920px;
      height: 1080px;
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: 16 / 9;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-left: 140px;
      background: #090A0F;
    }
    .eyebrow {
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #FF4F00;
      margin-bottom: 24px;
      opacity: 0;
      transform: translateY(10px);
    }
    .line-mask {
      overflow: hidden;
      padding-bottom: 0.08em;
      display: block;
    }
    .line {
      display: inline-block;
      font-size: 92px;
      font-weight: 850;
      letter-spacing: -0.04em;
      line-height: 0.94;
      transform: translateY(115%);
    }
    .line.accent {
      color: #FF4F00;
    }
    .grid-line {
      position: absolute;
      background: rgba(255, 255, 255, 0.08);
    }
    .grid-v { top: 0; bottom: 0; width: 1px; transform: scaleY(0); transform-origin: top; }
    .grid-h { left: 0; right: 0; height: 1px; transform: scaleX(0); transform-origin: left; }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="grid-line grid-v" style="left: 20%;"></div>
    <div class="grid-line grid-v" style="left: 60%;"></div>
    <div class="grid-line grid-h" style="top: 30%;"></div>
    <div class="grid-line grid-h" style="top: 70%;"></div>

    <div class="eyebrow" id="eyebrow">01 // KINETIC ACCELERATION</div>

    <div class="headline">
      <div class="line-mask"><span class="line">PROGRAMMATIC</span></div>
      <div class="line-mask"><span class="line">MOTION SYSTEMS</span></div>
      <div class="line-mask"><span class="line accent">BUILT FOR SPEED.</span></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ defaults: { ease: 'power4.out' } });

    tl.to('.grid-v', { scaleY: 1, duration: 0.8, stagger: 0.1 }, 0)
      .to('.grid-h', { scaleX: 1, duration: 0.8, stagger: 0.1 }, 0.2)
      .to('#eyebrow', { opacity: 1, y: 0, duration: 0.5 }, 0.3)
      .to('.line', { y: '0%', duration: 0.9, stagger: 0.08 }, 0.4);
  </script>
</body>
</html>
