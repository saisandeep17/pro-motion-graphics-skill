<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pro Motion Graphics V2 — GSAP Starter</title>
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
  <div id="app" class="viewport">
    <!-- Architectural Hairline Grid Backdrop -->
    <div id="grid-container" class="grid-backdrop"></div>

    <!-- Main Content Frame -->
    <main class="content-frame">
      <div class="metadata-eyebrow">01 // KINETIC MANIFESTO</div>

      <div class="headline-container">
        <div class="line-mask"><span class="line">ARCHITECTURAL MOTION.</span></div>
        <div class="line-mask"><span class="line">EXACT PHYSICS.</span></div>
        <div class="line-mask"><span class="line accent">ZERO AI SLOP.</span></div>
      </div>

      <div class="metric-card">
        <div class="card-inner">
          <div class="metric-label">RENDERING ACCURACY</div>
          <div class="metric-value"><span id="counter">0</span><span class="accent">%</span></div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
