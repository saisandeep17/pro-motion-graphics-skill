<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pro Motion Graphics V2 — HTML5 Canvas Starter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #090A0F;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      max-width: 1920px;
      max-height: 1080px;
      aspect-ratio: 16 / 9;
      display: block;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body>
  <canvas id="motion-canvas" width="1920" height="1080"></canvas>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
